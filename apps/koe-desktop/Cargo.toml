[package]
description = "Menu bar and overlay desktop recorder for koe"
edition.workspace = true
license.workspace = true
name = "koe-desktop"
version.workspace = true

[lib]
name = "koe_desktop"
path = "src/lib.rs"

[[bin]]
name = "koe-desktop"
path = "src/main.rs"

[dependencies]
gpui-kit.workspace = true
koe-capture.workspace = true
koe-record.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "0.26.1", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = { version = "0.26.1", default-features = false }

[dev-dependencies]
tempfile.workspace = true

[features]
linux = ["koe-capture/linux"]
macos = ["koe-capture/macos"]
windows = ["koe-capture/windows"]

[lints]
workspace = true
