[package]
description = "Menu bar and overlay desktop recorder for koe"
edition.workspace = true
license.workspace = true
name = "koe-desktop"
version.workspace = true

[lib]
name = "koe_desktop"
path = "src/lib.rs"

[[bin]]
name = "koe-desktop"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
enigo = "0.6"
global-hotkey = "0.10"
gpui-kit.workspace = true
koe-capture.workspace = true
koe-record.workspace = true
koe-transcribe.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
arboard = "3"
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }
x11rb = "0.13"

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "0.26.1", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = { version = "0.26.1", default-features = false }

[dev-dependencies]
tempfile.workspace = true

[features]
linux = ["koe-capture/linux", "koe-transcribe/linux"]
macos = ["koe-capture/macos", "koe-transcribe/macos"]
windows = ["koe-capture/windows", "koe-transcribe/windows"]

[lints]
workspace = true
