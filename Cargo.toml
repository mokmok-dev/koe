[workspace]
members = ["koe-cli", "koe-core", "koe-ffi", "koe-gui"]
resolver = "3"

[workspace.dependencies]
block2 = "0.6"
clap = "4.6.6"
dispatch2 = "0.3"
flacenc = { version = "0.5.1", default-features = false }
fs2 = "0.4"
log = "0.4"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false }
objc2-av-foundation = { version = "0.3", default-features = false }
objc2-core-media = { version = "0.3", default-features = false }
objc2-foundation = { version = "0.3", default-features = false }
objc2-screen-capture-kit = { version = "0.3", default-features = false }
objc2-speech = { version = "0.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5.5", default-features = false }
thiserror = "2.0.20"
tokio = "1.53.1"
toml = "0.8"
uniffi = "0.28"
vorbis_rs = "0.5.6"

[workspace.lints.clippy]
all = "deny"
expect_used = "deny"
nursery = "deny"
panic = "deny"
pedantic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[workspace.lints.rust]
future_incompatible = "deny"
unsafe_code = "deny"
unused = "deny"

[workspace.package]
edition = "2024"
version = "0.0.0"
