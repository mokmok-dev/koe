[workspace]
members = [
  "apps/koe-cli",
  "apps/koe-desktop",
  "crates/koe-capture",
  "crates/koe-capture-core",
  "crates/koe-capture-linux",
  "crates/koe-capture-macos",
  "crates/koe-capture-windows",
  "crates/koe-record",
  "crates/koe-record-core",
  "crates/koe-session",
  "crates/koe-session-store",
  "crates/koe-transcribe",
  "crates/koe-transcribe-core",
  "crates/koe-transcribe-ggml",
  "crates/koe-transcribe-macos",
]
resolver = "3"

[workspace.dependencies]
clap = { version = "4.6.7", default-features = false, features = [
  "derive",
  "error-context",
  "help",
  "std",
  "suggestions",
  "usage"
] }
ctrlc = "3.5.2"
eframe = "0.37.0"
egui = "0.37.0"
koe-capture = { path = "crates/koe-capture" }
koe-capture-core = { path = "crates/koe-capture-core" }
koe-capture-linux = { path = "crates/koe-capture-linux" }
koe-capture-macos = { path = "crates/koe-capture-macos" }
koe-capture-windows = { path = "crates/koe-capture-windows" }
koe-record = { path = "crates/koe-record" }
koe-record-core = { path = "crates/koe-record-core" }
koe-session = { path = "crates/koe-session" }
koe-session-store = { path = "crates/koe-session-store" }
koe-transcribe = { path = "crates/koe-transcribe" }
koe-transcribe-core = { path = "crates/koe-transcribe-core" }
koe-transcribe-ggml = { path = "crates/koe-transcribe-ggml" }
koe-transcribe-macos = { path = "crates/koe-transcribe-macos" }
libm = "0.2"
opus = "0.4.0"
proptest = "1.12.0"
stateright = "0.31.0"
tempfile = "3.27.0"
transcribe-cpp = "0.4.1"

[workspace.lints.clippy]
all = "warn"
doc_link_code = "warn"
expect_used = "warn"
missing_const_for_fn = "warn"
option_if_let_else = "warn"
panic = "warn"
pedantic = "warn"
redundant_clone = "warn"
redundant_pub_crate = "warn"
significant_drop_tightening = "warn"
suboptimal_flops = "warn"
todo = "warn"
unwrap_used = "warn"
use_self = "warn"

[workspace.lints.rust]
unexpected_cfgs = "warn"
unsafe_code = "deny"

[workspace.metadata.crane]
name = "koe"

[workspace.package]
edition = "2024"
license = "MIT"
version = "2026.11.1"
