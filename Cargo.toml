[workspace]
members = ["koe-cli"]
resolver = "3"

[workspace.dependencies]
clap = "4.6.6"
thiserror = "2.0.20"
tokio = "1.53.1"

[workspace.lints.clippy]
all = "deny"
expect_used = "deny"
nursery = "deny"
panic = "deny"
pedantic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[workspace.lints.rust]
future_incompatible = "deny"
unsafe_code = "deny"
unused = "deny"

[workspace.package]
edition = "2024"
version = "0.0.0"
