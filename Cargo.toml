[workspace]
members = [
  "apps/koe-cli",
  "crates/koe-app",
  "crates/koe-audio",
  "crates/koe-core",
  "crates/koe-recording",
]
resolver = "3"

[workspace.dependencies]
cap-std = "4.0.2"
clap = { version = "4.5.42", features = ["derive"] }
cpal = { version = "0.18.1", features = ["pipewire", "pulseaudio"] }
ctrlc = "3.4.7"
hound = "3.5.1"
koe-app = { path = "crates/koe-app" }
koe-audio = { path = "crates/koe-audio" }
koe-core = { path = "crates/koe-core" }
koe-recording = { path = "crates/koe-recording" }
objc2-av-foundation = { version = "0.3.2", default-features = false, features = [
  "AVCaptureDevice",
  "AVMediaFormat",
] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
sha2 = "0.10.9"
tempfile = "3.20.0"
thiserror = "2.0.12"
thingbuf = "0.1.6"
uuid = { version = "1.17.0", features = ["serde", "v4"] }

[workspace.lints.clippy]
all = "deny"
expect_used = "deny"
nursery = "deny"
panic = "deny"
pedantic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[workspace.lints.rust]
future_incompatible = "deny"
unsafe_code = "deny"
unused = "deny"

[workspace.package]
edition = "2024"
version = "0.0.0"
