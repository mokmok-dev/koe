# Runs the flake checks on every pull request and on main. The aarch64-darwin
# check builds the macOS speech shim with the Swift toolchain from the dev
# inputs and runs its tests, so koe keeps no separate macOS workflow.
name: nix
on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  DeterminateCI:
    uses: DeterminateSystems/ci/.github/workflows/workflow.yml@main
    permissions:
      id-token: write
      contents: read
