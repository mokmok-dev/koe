[package]
name = "koe-model"
version.workspace = true
edition.workspace = true

[features]
default = ["foundry-local"]
foundry-local = ["dep:foundry-local-sdk", "dep:futures-util"]

[dependencies]
async-trait.workspace = true
futures-util = { workspace = true, optional = true }
fs2 = "0.4"
cap-std.workspace = true
cap-fs-ext = "4.0.2"
koe-core.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true }
tokio-util.workspace = true
uuid.workspace = true

[target.'cfg(not(windows))'.dependencies]
foundry-local-sdk = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
foundry-local-sdk = { workspace = true, features = ["winml"], optional = true }
same-file = "1.0.6"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }
atomicwrites = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
